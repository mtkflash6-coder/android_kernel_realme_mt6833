name: Build NetHunter Kernel for Realme 8 5G (build auto fork)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev bison flex python3 libssl-dev zip 

      - name: Set Up Clang
        run: |
          mkdir -p clang
          # Using a more stable prebuilt Clang from Proton
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O clang.tar.gz
          tar -C clang --strip-components=1 -xzf clang.tar.gz

      - name: Clone Kernel Source
        run: |
          # Using the most stable MT6833 branch for Android 13
          git clone --depth=1 https://github.com/techyminati/android_kernel_realme_mt6833 -b android-13.0 kernel
          
      - name: Enable NetHunter Configs
        run: |
          cd kernel
          # Proving the script by checking if file exists before modifying
          if [ -f arch/arm64/configs/rm6833_defconfig ]; then
            scripts/config --file arch/arm64/configs/rm6833_defconfig -e CONFIG_USB_GADGET -e CONFIG_USB_F_HID -e CONFIG_USB_CONFIGFS_F_HID -e CONFIG_MAC80211 -e CONFIG_CFG80211 -e CONFIG_RTW88 -e CONFIG_RTL8188EUS -e CONFIG_ANDROID_BINDERFS
          else
            echo "Defconfig not found! Checking alternative path..."
            find arch/arm64/configs/ -name "*defconfig*"
            exit 1
          fi

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=$(pwd)/../clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out CC=clang rm6833_defconfig
          make -j$(nproc --all) O=out CC=clang 2>&1 | tee build.log

      - name: Check for Output
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Build Success!"
          else
            echo "Build failed. Check the logs."
            tail -n 100 kernel/build.log
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Realme8-5G
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
